<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sayfa Bulunamadı | Velora Halı</title>

    <meta name="robots"
          content="noindex, nofollow">

    <link rel="icon"
          href="images/logo/favicon.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

    <style>

        .error-page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 100px 20px;

            text-align: center;

            color: white;

            background: #10100f;
        }

        .error-content {
            max-width: 650px;
        }

        .error-number {
            color: #b38a4a;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: clamp(100px, 18vw, 220px);

            line-height: .8;

            margin-bottom: 35px;
        }

        .error-content h1 {
            color: white;

            font-size: clamp(40px, 6vw, 65px);

            margin-bottom: 20px;
        }

        .error-content p {
            max-width: 500px;

            margin: 0 auto 35px;

            color: rgba(255,255,255,.55);

            font-size: 14px;

            line-height: 1.8;
        }

        .error-content .logo {
            margin: 0 auto 55px;
        }

    </style>

</head>


<body>


<section class="error-page">

    <div class="error-content">


        <a href="index.html"
           class="logo">

            <span class="logo-main">
                VELORA
            </span>

            <span class="logo-sub">
                HALI
            </span>

        </a>


        <div class="error-number">
            404
        </div>


        <h1>
            Sayfa Bulunamadı
        </h1>


        <p>
            Aradığınız sayfa taşınmış, silinmiş veya
            artık mevcut olmayabilir. Velora Halı
            ana sayfasına dönerek devam edebilirsiniz.
        </p>


        <a href="index.html"
           class="button button-gold">

            Ana Sayfaya Dön

            <span>
                →
            </span>

        </a>

    </div>

</section>


</body>

</html>
